
##
## List of plugins
##
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

##
## end plugins
##

## theme switch by OS appearance
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null' \
  'set -g @catppuccin_flavor mocha' \
  'set -g @catppuccin_flavor latte'

# set prefix to C-a
unbind C-b
set -g prefix C-a

# Use Vi keys in the status bar command prompt (Ctrl+b -> :)
set -g status-keys vi

# Enable mouse support
set -g mouse on

##
## macOS copy/paste
##

# Use vi keys in copy mode
set-window-option -g mode-keys vi

# Bind 'v' to begin selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Bind 'y' to copy and send to macOS pbcopy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Bind 'Enter' to copy and send to macOS pbcopy
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Bind mouse drag end to copy to macOS pbcopy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

##
## End macOS copy/paste
## 

##
## Theme
##

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# no need for the clock in status line
set -g status-right ""
